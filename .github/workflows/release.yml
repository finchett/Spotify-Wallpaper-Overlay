name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build release archive
        run: ./package.sh --version "${GITHUB_REF_NAME#v}" --universal --archive

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/SpotifyWallpaper.zip \
            build/SpotifyWallpaper.zip.sha256 \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag
